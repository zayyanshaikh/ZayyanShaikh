<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Zayyan Shaikh, Web Developer from Karachi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#06281f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3a0"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3a0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(1.8);} }
    .l1 { animation: fade 0.6s ease-out 0.3s both; }
    .l2 { animation: fade 0.6s ease-out 0.9s both; }
    .l3 { animation: fade 0.6s ease-out 1.5s both; }
    .l4 { animation: fade 0.6s ease-out 2.1s both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>
  </g>

  <!-- Left: identity -->
  <g class="sans">
    <text x="60" y="78" fill="#22d3a0" font-size="16" letter-spacing="4" font-weight="600">KARACHI · PAKISTAN</text>
    <text x="58" y="148" fill="#ffffff" font-size="64" font-weight="800">Zayyan Shaikh</text>
    <rect x="60" y="165" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="60" y="208" fill="#cbd5e1" font-size="26" font-weight="500">Web Developer · Next.js · TypeScript</text>
    <text x="60" y="248" fill="#94a3b8" font-size="19">Websites &amp; WhatsApp ordering for Karachi’s local brands</text>
  </g>

  <!-- Open to work pill -->
  <g class="sans">
    <rect x="60" y="270" width="190" height="32" rx="16" fill="#22d3a0" fill-opacity="0.12" stroke="#22d3a0" stroke-opacity="0.5"/>
    <circle class="pulse" cx="82" cy="286" r="5" fill="#22d3a0"/>
    <text x="98" y="291" fill="#22d3a0" font-size="14" font-weight="600">Open to freelance</text>
  </g>

  <!-- Right: code window -->
  <g class="float">
    <rect x="720" y="52" width="420" height="216" rx="14" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="720" y="52" width="420" height="38" rx="14" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="745" cy="71" r="6" fill="#ff5f56"/>
    <circle cx="767" cy="71" r="6" fill="#ffbd2e"/>
    <circle cx="789" cy="71" r="6" fill="#27c93f"/>
    <text class="mono" x="930" y="76" fill="#64748b" font-size="13">order-system.ts</text>

    <g class="mono" font-size="16">
      <g class="l1"><text x="745" y="125"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> order = {</tspan></text></g>
      <g class="l2"><text x="765" y="155"><tspan fill="#7dd3fc">customer</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">"Karachi 🇵🇰"</tspan><tspan fill="#e2e8f0">,</tspan></text></g>
      <g class="l3"><text x="765" y="185"><tspan fill="#7dd3fc">via</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">"WhatsApp"</tspan><tspan fill="#e2e8f0">,</tspan></text></g>
      <g class="l4"><text x="765" y="215"><tspan fill="#7dd3fc">status</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#22d3a0">"delivered ✓"</tspan></text></g>
      <text x="745" y="245" fill="#e2e8f0">};<tspan class="blink" fill="#22d3a0"> ▌</tspan></text>
    </g>
  </g>
</svg>
